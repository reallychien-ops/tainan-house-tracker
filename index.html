<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台南找房</title>
<meta name="description" content="台南透天物件地圖：每日查價、下架追蹤、新案雷達、液化／淹水／宮廟／地籍／道館圖層">
<meta name="theme-color" content="#ffffff">
<script>if (/githack\.com$/.test(location.hostname)) location.replace('https://reallychien-ops.github.io/tainan-house-tracker/');</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="台南找房">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#f4f5f7; --surface:#fff; --surface-2:#f8f9fb; --ink:#0f1729; --ink-2:#334155; --muted:#7a8699;
  --line:#e6e8ec; --accent:#2563eb; --accent-soft:#e8efff; --new:#7c3aed; --new-soft:#f1eaff;
  --down:#059669; --down-soft:#e3f6ee; --up:#dc2626; --up-soft:#fdecec; --warn:#d97706; --warn-soft:#fdf3e1;
  --r:18px; --r-sm:12px;
  --sh-1:0 1px 2px rgba(15,23,41,.06),0 1px 1px rgba(15,23,41,.04);
  --sh-2:0 2px 6px rgba(15,23,41,.06),0 10px 28px rgba(15,23,41,.10);
  --sh-3:0 6px 16px rgba(15,23,41,.10),0 24px 48px rgba(15,23,41,.16);
  --num:"Inter",system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans TC",system-ui,-apple-system,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:var(--num);font-feature-settings:"tnum"}

/* ---------- layout ---------- */
#app{position:fixed;inset:0;display:grid;grid-template-columns:420px 1fr}
#map{position:relative;height:100%;background:#e9ecef}
#panel{position:relative;z-index:500;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--line);min-height:0}
.handle{display:none}

/* ---------- panel header ---------- */
.head{padding:18px 18px 10px;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:34px;border-radius:10px;box-shadow:var(--sh-1)}
.brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.02em}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:400;letter-spacing:0}
.brand .sp{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:44px;color:var(--muted);transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);background:#fff}
.search input{flex:1;border:0;outline:0;background:none;font:inherit;color:var(--ink);min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 13px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);box-shadow:var(--sh-1);transition:all .15s;flex:none}
.chip:hover{border-color:#cfd5dd;transform:translateY(-1px)}
.chip b{font:600 13px var(--num)}
.chip svg.i{width:17px;height:17px}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 4px 12px rgba(15,23,41,.25)}
.chip.c-new[aria-pressed=false] svg{color:var(--new)}
.chip.c-down[aria-pressed=false] svg{color:var(--down)}
.chip.c-star[aria-pressed=false] svg{color:#f59e0b}
.ranges{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ranges select{height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);font:inherit;font-size:14px;padding:0 10px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.ranges select.on{background-color:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- icon buttons ---------- */
.ib{position:relative;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;color:var(--ink-2);transition:background .15s,color .15s,transform .1s}
.ib:hover{background:var(--surface-2);color:var(--ink)}
.ib:active{transform:scale(.94)}
.ib .dot{position:absolute;top:-3px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--up);color:#fff;font:700 10px/17px var(--num);text-align:center;box-shadow:0 0 0 2px #fff}
.ib.solid{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.35)}
.ib.solid:hover{background:#1d4ed8}

/* ---------- list ---------- */
.meta-row{display:flex;align-items:center;justify-content:space-between;padding:4px 18px 8px;color:var(--muted);font-size:12px}
#list{flex:1;overflow-y:auto;padding:4px 14px calc(24px + var(--safe-b));display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 10px;box-shadow:var(--sh-1);transition:box-shadow .2s,border-color .2s,transform .2s;scroll-margin:12px}
.card:hover{box-shadow:var(--sh-2)}
.card.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--sh-2)}
.card.gone{opacity:.72}
.c-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:7px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--ink-2)}
.tag svg.i{width:13px;height:13px;stroke-width:2.2}
.tag.new{background:var(--new);color:#fff;font:700 11px var(--num);letter-spacing:.06em}
.tag.down{background:var(--down-soft);color:var(--down)}
.tag.up{background:var(--up-soft);color:var(--up)}
.tag.star{background:#fff6e0;color:#b45309}
.tag.gone{background:#eef0f3;color:var(--muted)}
.c-district{color:var(--muted);font-size:12px;margin-left:auto}
.c-title{font-weight:700;font-size:15px;line-height:1.45;margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.c-price{display:flex;align-items:baseline;gap:6px;margin-bottom:8px}
.c-price strong{font:700 24px/1 var(--num);letter-spacing:-.01em}
.c-price span{color:var(--muted);font-size:13px}
.c-price s{color:var(--muted);font:500 13px var(--num)}
.c-facts{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink-2);font-size:13px;margin-bottom:6px}
.c-facts>span{display:inline-flex;align-items:center;gap:5px}
.c-facts svg.i{width:15px;height:15px;color:var(--muted)}
.lv{width:9px;height:9px;border-radius:50%;display:inline-block}
.lv.low{background:#10b981}.lv.med{background:#f59e0b}.lv.high{background:#ef4444}.lv.unknown{background:#cbd5e1}
.c-act{display:flex;align-items:center;gap:2px;border-top:1px solid var(--line);margin-top:8px;padding-top:6px}
.c-act .sp{flex:1}
.c-act .ib{width:38px;height:38px}
.c-act .ib.nav{background:var(--accent);color:#fff;width:44px;box-shadow:0 3px 10px rgba(37,99,235,.3)}
.c-act .ib.nav:hover{background:#1d4ed8}
.c-act .ib.danger:hover{background:var(--up-soft);color:var(--up)}
.c-act .ib.more svg{transition:transform .2s}
.card.open .c-act .ib.more svg{transform:rotate(180deg)}
.detail{display:none;margin-top:6px;border-top:1px dashed var(--line);padding-top:10px;font-size:13px}
.card.open .detail{display:block}
.detail dl{display:grid;grid-template-columns:22px 1fr;gap:8px 8px;margin:0}
.detail dt{color:var(--muted);padding-top:1px}
.detail dt svg.i{width:16px;height:16px}
.detail dd{margin:0;color:var(--ink-2)}
.detail .note{margin-top:10px;background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;color:var(--ink-2)}
.hist{display:flex;gap:6px;flex-wrap:wrap}
.hist span{font:500 12px var(--num);background:var(--surface-2);border-radius:6px;padding:2px 7px}
.gym-list{display:flex;flex-wrap:wrap;gap:6px}
.gym-list span{font-size:12px;background:#f3f0ff;color:#5b21b6;border-radius:6px;padding:2px 7px}
.empty{color:var(--muted);text-align:center;padding:48px 0}

/* ---------- map controls ---------- */
.fabs{position:absolute;top:16px;right:16px;z-index:600;display:flex;flex-direction:column;gap:10px}
.fab{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:var(--surface);color:var(--ink);box-shadow:var(--sh-2);border:1px solid rgba(15,23,41,.06);transition:transform .12s,box-shadow .15s,background .15s,color .15s}
.fab:hover{transform:translateY(-2px);box-shadow:var(--sh-3)}
.fab:active{transform:scale(.94)}
.fab[aria-pressed=true]{background:var(--ink);color:#fff}
.fab[hidden]{display:none}
.fab svg.i{width:22px;height:22px}
.layers{position:absolute;top:16px;right:76px;z-index:600;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-3);padding:10px;display:grid;grid-template-columns:repeat(5,60px);gap:8px;opacity:0;transform:translateX(8px) scale(.98);pointer-events:none;transition:all .18s}
.layers.show{opacity:1;transform:none;pointer-events:auto}
.lt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:60px;height:60px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);transition:all .15s}
.lt small{font-size:11px;line-height:1;color:var(--muted)}
.lt[aria-pressed=true] small{color:#cbd5e1}
.lt:hover{transform:translateY(-1px);border-color:#cfd5dd}
.lt[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 4px 12px rgba(15,23,41,.25)}
.lt svg.i{width:24px;height:24px}
.lt .gymball{width:24px;height:24px}
#lgd{position:absolute;left:16px;top:16px;z-index:600;background:var(--surface);border-radius:var(--r-sm);box-shadow:var(--sh-2);padding:8px 10px;font-size:12px;color:var(--ink-2);display:none;flex-direction:column;gap:6px;max-width:250px}
#lgd.show{display:flex}
#lgd b{font-weight:700;font-size:12px;color:var(--ink)}
#lgd .row{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
#lgd .row span{display:inline-flex;align-items:center;gap:4px}
#lgd i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.12)}
#lgd .hint{color:var(--muted);font-size:11px}
#lgd:not(.mini){padding-right:34px}
#lgd .lgd-x{position:absolute;top:2px;right:2px;width:30px;height:30px;border-radius:9px}
#lgd .lgd-x svg.i{width:16px;height:16px}
#lgd.mini{padding:0}
#lgd .lgd-open{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;font-size:13px;color:var(--ink-2)}
#lgd .lgd-open svg.i{width:16px;height:16px}

/* pins */
.pin{--pc:var(--ink);position:absolute;left:0;top:0;transform:translate(-50%,calc(-100% - 7px));background:var(--pc);color:#fff;font:700 12px/1 var(--num);padding:6px 9px;border-radius:10px;white-space:nowrap;box-shadow:0 3px 10px rgba(15,23,41,.3);border:2px solid #fff;transition:transform .15s}
.pin::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--pc);border-bottom:0}
.pin.star{--pc:#0f1729}
.pin.new{--pc:var(--new)}
.pin.down{--pc:var(--down)}
.pin.radar{--pc:#475569}
.pin.on{transform:translate(-50%,calc(-100% - 7px)) scale(1.18);z-index:1000;box-shadow:0 0 0 4px rgba(37,99,235,.35),0 6px 16px rgba(15,23,41,.35)}
.pin i{font-style:normal;font-size:9px;margin-left:3px;opacity:.85}
.gym-pin{width:18px;height:18px;transform:translate(-50%,-50%);filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.gym-pin.strong{width:22px;height:22px}
#map:not(.z-near) .gym-pin:not(.strong){display:none}
.z-far .pin{width:14px;height:14px;padding:0;font-size:0;border-radius:50%;transform:translate(-50%,-50%);border-width:2px}
.z-far .pin::after,.z-far .pin i{display:none}
.z-far .pin.on{transform:translate(-50%,-50%) scale(1.5)}
.base-tiles{filter:grayscale(1) contrast(.92) brightness(1.06)}
.flood-img{image-rendering:pixelated}
.stsp{transform:translate(-50%,-50%);background:#fff;border-radius:10px;padding:4px;box-shadow:var(--sh-2);display:grid;place-items:center;color:#0f1729}
.leaflet-container{font:inherit}
.leaflet-popup-content-wrapper{border-radius:14px;box-shadow:var(--sh-3)}
.leaflet-popup-content{margin:12px 14px;font-size:13px}
.leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.7)!important}
.leaflet-control-zoom{display:none}

/* sheets */
.overlay{position:fixed;inset:0;z-index:2000;background:rgba(15,23,41,.32);display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.modal{background:var(--surface);width:min(560px,100%);max-height:80vh;border-radius:22px 22px 0 0;padding:16px 18px calc(18px + var(--safe-b));overflow-y:auto;box-shadow:var(--sh-3);animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.modal header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.modal header h2{font-size:16px;margin:0;flex:1}
.log{border-left:2px solid var(--line);padding:2px 0 12px 14px;position:relative}
.log::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.log time{font:600 13px var(--num)}
.log ul{margin:4px 0 0;padding-left:18px;color:var(--ink-2);font-size:13px}
.log .err{color:var(--up)}
.toast{position:fixed;left:50%;bottom:calc(28px + var(--safe-b));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;box-shadow:var(--sh-3);opacity:0;pointer-events:none;transition:all .2s;z-index:3000}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- mobile: bottom sheet ---------- */
@media (max-width:899px){
  #app{display:block}
  #map{position:absolute;inset:0}
  #panel{z-index:700;position:absolute;left:0;right:0;bottom:0;height:calc(100% - 64px - var(--safe-t));border-right:0;border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(15,23,41,.14);transform:translateY(var(--sheet-y,calc(100% - 196px)));transition:transform .28s cubic-bezier(.2,.8,.2,1);will-change:transform}
  #panel.drag{transition:none}
  .handle{display:block;width:100%;height:22px;position:relative;cursor:grab;touch-action:none}
  .handle::after{content:"";position:absolute;left:50%;top:9px;width:40px;height:5px;border-radius:3px;background:#d4d8de;transform:translateX(-50%)}
  .head{padding:0 14px 8px;touch-action:pan-x}
  .brand{display:none}
  .meta-row{padding:0 16px 6px}
  #list{padding:4px 12px calc(24px + var(--safe-b))}
  .fabs{top:calc(12px + var(--safe-t));right:12px}
  .layers{top:calc(12px + var(--safe-t));right:70px;grid-template-columns:repeat(3,60px)}
  #lgd{left:12px;top:calc(70px + var(--safe-t))}
  .mtop{display:flex!important}
}
.mtop{display:none;position:absolute;top:calc(12px + var(--safe-t));left:12px;z-index:600;align-items:center;gap:8px;background:var(--surface);border-radius:15px;box-shadow:var(--sh-2);padding:4px 6px 4px 4px;height:48px}
.mtop img{width:38px;height:38px;border-radius:11px}
.mtop .t{font-weight:700;font-size:14px;line-height:1.15}
.mtop .t small{display:block;font:500 11px var(--num);color:var(--muted)}
</style>
</head>

  <div id="instBody" style="padding:4px 18px 18px;font-size:14px;line-height:1.7"></div>
</div></div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = s => document.querySelector(s);
const icon = (id, cls='i') => `<svg class="${cls}"><use href="#${id}"/></svg>`;
const fmt = n => Number(n).toLocaleString('en-US', {maximumFractionDigits: 1});
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NEW_DAYS = 7, SEED_DATE = '2026-11-10';
const TAINAN = L.latLngBounds([22.87, 120.02], [23.42, 120.67]);

let data = {properties: [], temples: []}, logs = [];
let filter = 'all', selected = null;
const hidden = new Set(JSON.parse(safeGet('tainan_untracked_ids') || '[]'));
function safeGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function safeSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

/* ---------- derived state ---------- */
const daysSince = d => d ? (Date.now() - new Date(d + 'T00:00:00+08:00')) / 864e5 : 1e9;
const isGone = p => p.status === '已下架';
const isOff = p => isGone(p) || hidden.has(p.id) || p.tracked === false;
const isNew = p => p.added_at > SEED_DATE && daysSince(p.added_at) <= NEW_DAYS;
const isStar = p => String(p.rank || '').includes('⭐');
const isRadar = p => String(p.rank || '').includes('雷達');
const trend = p => {
  const h = p.price_history || [];
  if (h.length < 2) return 0;
  return h[h.length - 1].price - h[h.length - 2].price;
};
const kind = p => isNew(p) ? 'new' : trend(p) < 0 ? 'down' : isStar(p) ? 'star' : (p.rank || '').includes('雷達') ? 'radar' : 'star';

const FILTERS = [
  {id: 'all', ic: 'i-grid', label: '全部追蹤中', test: p => !isOff(p)},
  {id: 'star', ic: 'i-star', cls: 'c-star', label: '精選', test: p => !isOff(p) && isStar(p)},
  {id: 'new', ic: 'i-spark', cls: 'c-new', label: `${NEW_DAYS} 天內新加`, test: p => !isOff(p) && isNew(p)},
  {id: 'down', ic: 'i-down', cls: 'c-down', label: '有降價', test: p => !isOff(p) && trend(p) < 0},
  {id: 'off', ic: 'i-archive', label: '已下架／不追蹤', test: p => isOff(p)},
];

function query(p){
  const q = $('#q').value.trim().toLowerCase();
  if (!q) return true;
  return `${p.id} ${p.district_road} ${p.title} ${p.zone_type} ${p.summary_note}`.toLowerCase().includes(q);
}
const PRICE_OPTS = [1300, 1400, 1500, 1600, 1700, 1800, 1900], AGE_OPTS = [5, 10, 15, 20, 25];
$('#maxPrice').insertAdjacentHTML('beforeend', PRICE_OPTS.map(v => `<option value="${v}">${fmt(v)} 萬以下</option>`).join(''));
$('#maxAge').insertAdjacentHTML('beforeend', AGE_OPTS.map(v => `<option value="${v}">屋齡 ${v} 年內</option>`).join(''));
['maxPrice', 'maxAge'].forEach(id => { const el = $('#' + id); el.value = safeGet('tainan_' + id) || ''; el.classList.toggle('on', !!el.value); });
const inRange = p => (!$('#maxPrice').value || p.price <= +$('#maxPrice').value) && (!$('#maxAge').value || p.age <= +$('#maxAge').value);
const visible = () => data.properties.filter(p => FILTERS.find(f => f.id === filter).test(p) && query(p) && inRange(p))
  .sort((a, b) => (isStar(b) - isStar(a)) || (isRadar(a) - isRadar(b)) || (isNew(b) - isNew(a)) || String(a.rank).localeCompare(String(b.rank)) || a.price - b.price);

/* ---------- map ---------- */
const map = L.map('map', {zoomControl: false, maxBounds: TAINAN.pad(0.02), maxBoundsViscosity: 1, minZoom: 10, maxZoom: 19, attributionControl: true})
  .setView([23.05, 120.25], 11);
L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP16/default/GoogleMapsCompatible/{z}/{y}/{x}', {
  maxZoom: 19, maxNativeZoom: 19, bounds: TAINAN.pad(0.05), className: 'base-tiles',
  attribution: '© 內政部國土測繪中心'
}).addTo(map);
L.tileLayer.wms('https://wms.nlsc.gov.tw/wms', {layers: 'CITY', format: 'image/png', transparent: true, opacity: .5, className: 'city-line'}).addTo(map);
const zoomClass = () => { const z = map.getZoom(), el = map.getContainer(); el.classList.toggle('z-far', z < 13); el.classList.toggle('z-near', z >= 14); };
map.on('zoomend', zoomClass); zoomClass();
map.setMinZoom(map.getBoundsZoom(TAINAN, false));

const markers = L.layerGroup().addTo(map);
const focusLayer = L.layerGroup().addTo(map);
const markerById = {};
L.marker([23.1015, 120.2745], {icon: L.divIcon({className: '', iconSize: [0, 0], html: `<div class="stsp" title="南科">${icon('i-factory')}</div>`}), keyboard: false})
  .bindPopup('<b>南部科學園區</b><br>善化／新市／安定 約 5–12 分鐘；新化／永康／安南／麻豆 約 15–20 分鐘').addTo(map);

/* layers: liquefaction / flood / temple / cadastral / gyms */
const LIQ_URL = 'https://gis.liquid.net.tw/arcgis/rest/services/P04032/Soil_cgs_2026/MapServer';
const LiqLayer = L.GridLayer.extend({createTile(c){
  const t = document.createElement('img'), m = this._map;
  const nw = m.unproject([c.x * 256, c.y * 256], c.z), se = m.unproject([(c.x + 1) * 256, (c.y + 1) * 256], c.z);
  t.src = `${LIQ_URL}/export?bbox=${nw.lng},${se.lat},${se.lng},${nw.lat}&bboxSR=4326&imageSR=3857&size=256,256&format=png32&transparent=true&f=image`;
  t.alt = ''; return t;
}});
// 水利署第三代淹水潛勢（24 小時 650mm），台南範圍預先轉成 flood_650.png（build_flood.py），不即時連水利署（有防爬蟲驗證碼）
const FLOOD = [null, ['#9fd8ff', '0.3–0.5'], ['#4fb0f5', '0.5–1'], ['#1f7fe0', '1–2'], ['#1847b8', '2–3'], ['#170f73', '>3']];
let floodData = null;
const loadFlood = () => floodData ||= fetch('flood_650.json').then(r => r.json()).then(m => new Promise((ok, bad) => {
  const img = new Image(); img.onload = () => ok({...m, img}); img.onerror = bad; img.src = 'flood_650.png';
}));
// 查某一點的淹水級距：只把那 1 個像素畫到小畫布上讀顏色
async function floodAt(lat, lng){
  const m = await loadFlood(), [[s, w], [n, e]] = m.bounds, [W, H] = m.size;
  const my = la => Math.log(Math.tan(Math.PI / 4 + la * Math.PI / 360));
  const x = Math.floor((lng - w) / (e - w) * W), y = Math.floor((my(n) - my(lat)) / (my(n) - my(s)) * H);
  if (x < 0 || y < 0 || x >= W || y >= H) return 0;
  const cv = document.createElement('canvas'); cv.width = cv.height = 1;
  const cx = cv.getContext('2d'); cx.drawImage(m.img, x, y, 1, 1, 0, 0, 1, 1);
  const [r, g, b, a] = cx.getImageData(0, 0, 1, 1).data;
  if (a < 128) return 0;
  let best = 1, bd = 1e9;
  FLOOD.forEach((f, i) => { if (!f) return; const h = parseInt(f[0].slice(1), 16), d = (r - (h >> 16)) ** 2 + (g - (h >> 8 & 255)) ** 2 + (b - (h & 255)) ** 2; if (d < bd){ bd = d; best = i; } });
  return best;
}
const LAYERS = {
  liq: {ic: 'i-wave', short: '液化', name: '土壤液化潛勢（地調所 2026）', make: () => new LiqLayer({opacity: .5})},
  flood: {ic: 'i-drop', short: '淹水', name: '淹水潛勢（水利署，一日 650mm 豪雨）', make: () => {
    const g = L.layerGroup();
    loadFlood().then(m => L.imageOverlay('flood_650.png', m.bounds, {opacity: .7, interactive: false, className: 'flood-img'}).addTo(g))
      .catch(() => toast('淹水資料載入失敗'));
    return g;
  }},
  temple: {ic: 'i-temple', short: '宮廟', name: '物件 500m 內登記宮廟＋150m 範圍', make: () => L.layerGroup(), dynamic: true},
  sect: {ic: 'i-parcel', short: '地籍', name: '地籍段界（國土測繪中心）', make: () => L.tileLayer.wms('https://wms.nlsc.gov.tw/wms', {layers: 'LANDSECT', format: 'image/png', transparent: true, opacity: .65})},
  gym: {ic: 'gymball', short: '道館', name: '物件 500m 內道館', make: () => L.layerGroup(), dynamic: true},
};
function renderLegend(){
  const rows = [];
  if (layerOn.liq) rows.push(`<b>土壤液化（大地震時地層變軟下陷的可能）</b><div class="row"><span><i style="background:#55ff00"></i>低</span><span><i style="background:#ffff00"></i>中</span><span><i style="background:#ff0000"></i>高</span><span class="hint">沒顏色＝未列潛勢區</span></div>`);
  if (layerOn.flood) rows.push(`<b>淹水（一日下 650mm 豪雨，可能淹多深）</b><div class="row">${FLOOD.slice(1).map(([c, t]) => `<span><i style="background:${c}"></i>${t}m</span>`).join('')}</div>`);
  if (rows.length) rows.push('<span class="hint">點地圖任一處，可查那個位置的等級</span>');
  const closed = safeGet('tainan_lgd_closed') === '1';
  $('#lgd').classList.toggle('mini', closed);
  $('#lgd').innerHTML = closed ? `<button class="lgd-open" data-lgd="open">${icon('i-layers')}圖例</button>`
    : `<button class="ib lgd-x" data-lgd="close" title="關閉圖例" aria-label="關閉圖例">${icon('i-x')}</button>` + rows.join('');
  $('#lgd').classList.toggle('show', rows.length > 0);
}
const layerOn = JSON.parse(safeGet('tainan_layers') || '{}');
const layerObj = {};
function gymMarker(g, strong){
  return L.marker([g.lat, g.lng], {icon: L.divIcon({className: '', iconSize: [0, 0], html: `<svg class="gym-pin${strong ? ' strong' : ''}"><use href="#gymball"/></svg>`}), keyboard: false, zIndexOffset: -100})
    .bindTooltip(`${esc(g.name)}${g.dist != null ? ` · ${g.dist}m` : ''}`, {direction: 'top', offset: [0, -10]});
}
function drawGyms(){
  const g = layerObj.gym; if (!g) return;
  g.clearLayers();
  const seen = new Set();
  visible().filter(p => !isGone(p)).forEach(p => (p.gyms || []).forEach(x => {
    const k = x.lat + ',' + x.lng; if (seen.has(k)) return; seen.add(k);
    gymMarker({...x, dist: null}).addTo(g);
  }));
}
function drawTemples(){
  const g = layerObj.temple; if (!g) return;
  g.clearLayers();
  const homes = visible().filter(p => !isGone(p) && p.lat).map(p => L.latLng(p.lat, p.lng));
  (data.temples || []).filter(t => homes.some(h => h.distanceTo([t.lat, t.lng]) <= 500)).forEach(t => {
    L.circle([t.lat, t.lng], {radius: 150, color: '#ef4444', weight: .8, fillOpacity: .08, interactive: false}).addTo(g);
    L.circleMarker([t.lat, t.lng], {radius: 3.5, color: '#b91c1c', weight: 1, fillColor: '#ef4444', fillOpacity: .9})
      .bindPopup(`<b>${esc(t.name)}</b><br>${esc(t.deity || '')}<br><span style="color:#64748b">${esc(t.addr || '')}</span>`).addTo(g);
  });
}
function setLayer(id, on){
  layerOn[id] = on; safeSet('tainan_layers', JSON.stringify(layerOn));
  if (on && !layerObj[id]) layerObj[id] = LAYERS[id].make();
  if (layerObj[id]) on ? layerObj[id].addTo(map) : map.removeLayer(layerObj[id]);
  if (id === 'gym' && on) drawGyms();
  if (id === 'temple' && on) drawTemples();
  document.querySelector(`.lt[data-id="${id}"]`)?.setAttribute('aria-pressed', on);
  renderLegend();
}
$('#layers').innerHTML = Object.entries(LAYERS).map(([id, l]) =>
  `<button class="lt" data-id="${id}" title="${l.name}" aria-label="${l.name}" aria-pressed="false">${id === 'gym' ? '<svg class="gymball"><use href="#gymball"/></svg>' : icon(l.ic)}<small>${l.short}</small></button>`).join('');
// 地圖上的按鈕不要把點擊傳給地圖（否則地圖的 click 會立刻把圖層面板收起來）
['.fabs', '#layers', '.mtop', '#lgd'].forEach(sel => { L.DomEvent.disableClickPropagation($(sel)); L.DomEvent.disableScrollPropagation($(sel)); });
$('#lgd').addEventListener('click', e => {
  const b = e.target.closest('[data-lgd]'); if (!b) return;
  e.stopPropagation(); // 按鈕會被換掉，Leaflet 找不到它在圖例裡，會當成點地圖
  safeSet('tainan_lgd_closed', b.dataset.lgd === 'close' ? '1' : '0'); renderLegend();
});
$('#layers').addEventListener('click', e => {
  const b = e.target.closest('.lt'); if (!b) return;
  const on = b.getAttribute('aria-pressed') !== 'true';
  setLayer(b.dataset.id, on);
  toast(`${on ? '開啟' : '關閉'}：${LAYERS[b.dataset.id].name}`);
});

function drawMarkers(){
  markers.clearLayers();
  for (const k in markerById) delete markerById[k];
  visible().filter(p => !isGone(p) && p.lat).forEach(p => {
    const k = kind(p);
    const html = `<div class="pin ${k}${selected === p.id ? ' on' : ''}">${fmt(p.price)}${k === 'new' ? '<i>NEW</i>' : ''}</div>`;
    const m = L.marker([p.lat, p.lng], {icon: L.divIcon({className: '', iconSize: [0, 0], html}), riseOnHover: true, title: p.title})
      .on('click', () => select(p.id, true, false));
    m.addTo(markers); markerById[p.id] = m;
  });
  drawGyms(); drawTemples();
}

function select(id, scrollList = true, pan = true){
  selected = id;
  const p = data.properties.find(x => x.id === id);
  document.querySelectorAll('.card.on').forEach(c => c.classList.remove('on'));
  document.querySelectorAll('.pin.on').forEach(c => c.classList.remove('on'));
  const card = document.getElementById('card-' + id);
  card?.classList.add('on');
  markerById[id]?.getElement()?.querySelector('.pin')?.classList.add('on');
  focusLayer.clearLayers();
  if (!p || !p.lat) return;
  L.circle([p.lat, p.lng], {radius: 500, color: '#7c3aed', weight: 1.5, dashArray: '5 6', fillColor: '#7c3aed', fillOpacity: .05, interactive: false}).addTo(focusLayer);
  (p.gyms || []).forEach(g => gymMarker(g, true).addTo(focusLayer));
  if (pan){
    const z = Math.max(map.getZoom(), 15);
    // 手機：清單蓋住地圖下半，把物件往上移到看得到的地方
    map.flyTo(map.unproject(map.project([p.lat, p.lng], z).add([0, isMobile() ? (panel.offsetHeight - sheetPos(sheetState)) / 2 : 0]), z), z, {duration: .6});
  }
  if (scrollList && card){
    const list = $('#list');
    if (isMobile()) list.scrollTop += card.getBoundingClientRect().top - list.getBoundingClientRect().top - 4; // 清單保持收起，拉上來就是這間
    else card.scrollIntoView({behavior: 'smooth', block: 'start'});
  }
}

/* ---------- list ---------- */
function card(p){
  const t = trend(p), first = (p.price_history || [])[0];
  const tags = [];
  if (isNew(p)) tags.push(`<span class="tag new">NEW</span>`);
  if (isGone(p)) tags.push(`<span class="tag gone">${icon('i-archive')}下架 ${esc(p.delisted_at || '')}</span>`);
  else if (hidden.has(p.id) || p.tracked === false) tags.push(`<span class="tag gone">不追蹤</span>`);
  if (t < 0) tags.push(`<span class="tag down">${icon('i-down')}<span class="num">${fmt(-t)}</span> 萬</span>`);
  if (t > 0) tags.push(`<span class="tag up">${icon('i-up')}<span class="num">${fmt(t)}</span> 萬</span>`);
  if (isStar(p)) tags.push(`<span class="tag star">${icon('i-star')}${esc(String(p.rank).replace(/^⭐\d+_/, ''))}</span>`);
  const gyms = (p.gyms || []).length;
  const orig = first && first.price !== p.price ? `<s>${fmt(first.price)}</s>` : '';
  const off = isOff(p);
  return `<article class="card${off ? ' gone' : ''}" id="card-${p.id}">
    <div class="c-top">${tags.join('')}<span class="c-district">${esc((p.district_road || '').split(/[（(]/)[0])}</span></div>
    <h3 class="c-title" data-act="focus">${esc(p.title)}</h3>
    <div class="c-price"><strong>${fmt(p.price)}</strong><span>萬</span>${orig}<span class="num">· ${fmt(p.unit_price)} 萬/坪</span></div>
    <div class="c-facts">
      <span title="屋齡">${icon('i-cal')}<span class="num">${fmt(p.age)}</span> 年</span>
      <span title="建坪／地坪">${icon('i-ruler')}<span class="num">${esc((p.area_str || '').replace(/建 |地 /g, ''))}</span> 坪</span>
      <span title="500m 內道館"><svg class="i" style="width:15px;height:15px"><use href="#gymball"/></svg><span class="num">${p.gyms ? gyms : '–'}</span></span>
      <span title="土壤液化：${esc(p.liq_desc)}"><i class="lv ${p.liq_level || 'unknown'}"></i>液化</span>
      <span title="淹水：${esc(p.flood_desc)}"><i class="lv ${({low: 'low', none: 'low', med: 'med', high: 'high'})[p.flood_level] || 'unknown'}"></i>淹水</span>
    </div>
    <div class="c-act">
      ${p.lat && !isGone(p) ? `<button class="ib nav" data-act="nav" title="Google 導航" aria-label="Google 導航">${icon('i-nav')}</button>` : ''}
      <button class="ib" data-act="link" title="開物件網頁" aria-label="開物件網頁">${icon('i-link')}</button>
      ${!isGone(p) ? `<button class="ib" data-act="focus" title="在地圖上看" aria-label="在地圖上看">${icon('i-pin')}</button>` : ''}
      <span class="sp"></span>
      ${isGone(p) ? '' : off ? `<button class="ib" data-act="restore" title="恢復追蹤" aria-label="恢復追蹤">${icon('i-undo')}</button>`
        : `<button class="ib danger" data-act="hide" title="不追蹤" aria-label="不追蹤">${icon('i-trash')}</button>`}
      <button class="ib more" data-act="more" title="詳細" aria-label="詳細">${icon('i-chev')}</button>
    </div>
    <div class="detail"><dl>
      <dt title="格局">${icon('i-home')}</dt><dd>${esc(p.layout)}</dd>
      <dt title="車庫與臨路">${icon('i-car')}</dt><dd>${esc(p.garage_road)}</dd>
      ${p.commute_pogo ? `<dt title="通勤與機能">${icon('i-route')}</dt><dd>${esc(p.commute_pogo)}</dd>` : ''}
      <dt title="淹水">${icon('i-drop')}</dt><dd>${esc(p.flood_desc)}</dd>
      <dt title="土壤液化">${icon('i-wave')}</dt><dd>${esc(p.liq_desc)}</dd>
      <dt title="宮廟">${icon('i-temple')}</dt><dd>${esc(p.temple_desc)}</dd>
      <dt title="地籍與道路">${icon('i-parcel')}</dt><dd>${esc(p.cadastral_desc)}</dd>
      <dt title="價格">${icon('i-coin')}</dt><dd>建議出價 ${esc(p.target_price)}｜自備 ${esc(p.cash_needed)}｜月付 ${esc(p.monthly_pay)}｜同區行情 ${esc(p.ref_unit_price)}</dd>
      <dt title="建商">${icon('i-build')}</dt><dd>${esc(p.developer)}</dd>
      <dt title="價格紀錄">${icon('i-cal')}</dt><dd><div class="hist">${(p.price_history || []).map(h => `<span>${esc(h.date.slice(5))} ${fmt(h.price)}</span>`).join('')}<span style="background:none;color:var(--muted)">加入 ${esc(p.added_at || '')}</span></div></dd>
      ${gyms ? `<dt title="附近道館"><svg class="i" style="width:16px;height:16px"><use href="#gymball"/></svg></dt><dd><div class="gym-list">${p.gyms.map(g => `<span>${esc(g.name)} ${g.dist}m</span>`).join('')}</div></dd>` : ''}
    </dl>${p.summary_note ? `<div class="note">${esc(p.summary_note)}</div>` : ''}</div>
  </article>`;
}

function renderChips(){
  $('#chips').innerHTML = FILTERS.map(f => {
    const n = data.properties.filter(p => f.test(p) && inRange(p)).length;
    return `<button class="chip ${f.cls || ''}" data-f="${f.id}" aria-pressed="${filter === f.id}" title="${f.label}" aria-label="${f.label} ${n}">${icon(f.ic)}<b>${n}</b></button>`;
  }).join('');
}
function render(){
  renderChips();
  const v = visible();
  $('#countText').textContent = `${FILTERS.find(f => f.id === filter).label} · ${v.length} 間`;
  $('#list').innerHTML = v.length ? v.map(card).join('') : `<div class="empty">沒有符合的物件</div>`;
  drawMarkers();
  if (selected && document.getElementById('card-' + selected)) select(selected, false, false); else focusLayer.clearLayers();
}

$('#chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  filter = b.dataset.f; render(); fitAll();
});
$('#q').addEventListener('input', () => render());
['maxPrice', 'maxAge'].forEach(id => $('#' + id).addEventListener('change', e => {
  safeSet('tainan_' + id, e.target.value); e.target.classList.toggle('on', !!e.target.value); render(); fitAll();
}));
$('#list').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const el = b.closest('.card'), id = el.id.slice(5), p = data.properties.find(x => x.id === id);
  ({
    nav: () => window.open(`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`, '_blank'),
    link: () => window.open(p.url, '_blank', 'noopener'),
    focus: () => { if (!isGone(p)) { select(id, false); if (isMobile()) setSheet('peek'); } },
    more: () => el.classList.toggle('open'),
    hide: () => track(p, false),
    restore: () => track(p, true),
  })[b.dataset.act]?.();
});

async function track(p, on){
  on ? hidden.delete(p.id) : hidden.add(p.id);
  if (on && p.tracked === false) p.tracked = true;
  safeSet('tainan_untracked_ids', JSON.stringify([...hidden]));
  toast(on ? `已恢復追蹤：${p.title}` : `已移到不追蹤：${p.title}`);
  render();
  if (location.port === '8765') fetch('/api/track', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id: p.id, tracked: on, sync_sheet: true})}).catch(() => {});
}

/* ---------- fab actions ---------- */
function fitAll(){
  const pts = visible().filter(p => !isGone(p) && p.lat).map(p => [p.lat, p.lng]);
  if (pts.length) map.flyToBounds(L.latLngBounds(pts).pad(.12), {duration: .6, paddingBottomRight: isMobile() ? [0, 160] : [0, 0], maxZoom: 15});
}
$('#btnFit').onclick = fitAll;
$('#btnLayers').onclick = () => {
  const on = !$('#layers').classList.contains('show');
  $('#layers').classList.toggle('show', on);
  $('#btnLayers').setAttribute('aria-pressed', on);
};
map.on('click', async e => {
  $('#layers').classList.remove('show'); $('#btnLayers').setAttribute('aria-pressed', false);
  if (!layerOn.liq && !layerOn.flood) return;
  const {lat, lng} = e.latlng, rows = [];
  const pop = L.popup({maxWidth: 240}).setLatLng(e.latlng).setContent('查詢中…').openOn(map);
  if (layerOn.liq){
    try {
      const d = await fetch(`${LIQ_URL}/0/query?geometry=${lng},${lat}&geometryType=esriGeometryPoint&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=TYPE&returnGeometry=false&f=json`).then(r => r.json());
      const t = d.features?.[0]?.attributes?.TYPE;
      rows.push(`液化：${({LOW: '🟢 低潛勢', MED: '🟡 中潛勢', HIGH: '🔴 高潛勢'})[t] || '⚪ 不在液化潛勢區'}`);
    } catch(err){ rows.push('液化：查詢失敗，請稍後再試'); }
  }
  if (layerOn.flood){
    const c = await floodAt(lat, lng).catch(() => -1);
    if (c < 0) rows.push('淹水：資料載入失敗'); else rows.push(`淹水（一日 650mm）：${c ? `${c <= 2 ? '🟡' : '🔴'} 可能淹 ${FLOOD[c][1]} 公尺` : '🟢 不在淹水潛勢區'}`);
  }
  pop.setContent(rows.join('<br>'));
});
let meLayer;
$('#btnLocate').onclick = () => {
  if (!navigator.geolocation) return toast('這個瀏覽器不支援定位');
  navigator.geolocation.getCurrentPosition(pos => {
    const ll = [pos.coords.latitude, pos.coords.longitude];
    meLayer?.remove();
    meLayer = L.circleMarker(ll, {radius: 8, color: '#fff', weight: 3, fillColor: '#2563eb', fillOpacity: 1}).addTo(map);
    if (TAINAN.contains(ll)) map.flyTo(ll, 15); else toast('你目前不在台南市範圍內');
  }, () => toast('無法取得位置'), {enableHighAccuracy: true, timeout: 8000});
};
$('#btnRefresh').onclick = async () => {
  $('#btnRefresh').firstElementChild.animate([{transform: 'rotate(0)'}, {transform: 'rotate(360deg)'}], {duration: 700});
  await load(true); toast(`資料更新於 ${data.updated_at}`);
};

/* ---------- change log ---------- */
function openLog(){
  $('#logBody').innerHTML = logs.slice(0, 20).map(l => `<div class="log"><time>${esc(l.timestamp)}</time>
    <span style="color:var(--muted);font-size:12px"> · 查 ${l.checked_count} 間 · 新 ${l.new_discovered_count} 間</span>
    <ul>${(l.changes || []).slice(0, 80).map(c => `<li>${esc(c)}</li>`).join('')}${(l.errors || []).map(c => `<li class="err">${esc(c)}</li>`).join('')}</ul></div>`).join('') || '<div class="empty">還沒有紀錄</div>';
  $('#logOverlay').classList.add('show');
  safeSet('tainan_log_seen', logs[0]?.timestamp || '');
  document.querySelectorAll('.ib .dot').forEach(d => d.hidden = true);
}
$('#btnLog').onclick = openLog; $('#btnLogM').onclick = openLog;
$('#logOverlay').addEventListener('click', e => { if (e.target === e.currentTarget || e.target.closest('[data-close]')) e.currentTarget.classList.remove('show'); });

let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

/* ---------- mobile bottom sheet ---------- */
const isMobile = () => matchMedia('(max-width: 899px)').matches;
const panel = $('#panel');
const peekH = () => $('#handle').offsetHeight + $('#sheetHead').offsetHeight + $('.meta-row').offsetHeight + 6;
function sheetPos(state){
  const h = panel.offsetHeight;
  return {peek: h - peekH(), full: 0}[state];
}
let sheetState = 'peek';
function setSheet(state){ sheetState = state; panel.style.setProperty('--sheet-y', sheetPos(state) + 'px'); }
// 手機底部清單拖拉：用 touch 事件自己處理（上下拖＝拉清單；左右滑＝捲動篩選列；清單捲到最上面再往下拉＝收起）
(function sheetDrag(){
  const list = $('#list');
  let g = null, lastTouch = 0;
  const start = (x, y, target, fromList) => {
    if (!isMobile()) return;
    if (fromList && sheetState === 'full' && list.scrollTop > 0) return;
    g = {x, y, t: Date.now(), start: sheetPos(sheetState), dir: null, fromList, target};
  };
  const move = (x, y, ev) => {
    if (!g) return;
    const dx = x - g.x, dy = y - g.y;
    if (!g.dir){
      if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      g.dir = Math.abs(dy) > Math.abs(dx) ? 'v' : 'h';
      // 清單已全開時，往上滑是捲清單，不是拉
      if (g.dir === 'h' || (g.fromList && sheetState === 'full' && dy < 0)){ g = null; return; }
      panel.classList.add('drag');
    }
    if (ev.cancelable) ev.preventDefault();
    panel.style.setProperty('--sheet-y', Math.max(0, g.start + dy) + 'px');
  };
  const end = y => {
    if (!g) return;
    const s = g; g = null; panel.classList.remove('drag');
    if (!s.dir){ // 點一下：點把手或空白處就切換高度，點按鈕／搜尋框照常
      if (!s.fromList && !s.target.closest('button,label,select,.chips,.ranges')) setSheet(sheetState === 'peek' ? 'full' : 'peek');
      return;
    }
    // 只有兩段：快速一甩就照方向；慢慢拉就看停在哪半邊
    const dy = y - s.y, v = dy / Math.max(1, Date.now() - s.t), cur = s.start + dy;
    setSheet(Math.abs(v) > .3 ? (v > 0 ? 'peek' : 'full') : cur < sheetPos('peek') / 2 ? 'full' : 'peek');
  };
  [[$('#handle'), false], [$('#sheetHead'), false], [$('.meta-row'), false], [list, true]].forEach(([el, fromList]) => {
    el.addEventListener('touchstart', e => (lastTouch = Date.now(), start(e.touches[0].clientX, e.touches[0].clientY, e.target, fromList)), {passive: true});
    el.addEventListener('touchmove', e => move(e.touches[0].clientX, e.touches[0].clientY, e), {passive: false});
    el.addEventListener('touchend', e => end(e.changedTouches[0].clientY));
    el.addEventListener('touchcancel', e => end(e.changedTouches[0].clientY));
    if (fromList) return;
    el.addEventListener('mousedown', e => { if (Date.now() - lastTouch > 800) start(e.clientX, e.clientY, e.target, false); }); // 手機點一下之後瀏覽器會再補送滑鼠事件，不理它，否則會切換兩次
  });
  addEventListener('mousemove', e => g && move(e.clientX, e.clientY, e));
  addEventListener('mouseup', e => end(e.clientY));
  addEventListener('resize', () => isMobile() && setSheet(sheetState));
})();

/* ---------- install ---------- */
let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#btnInstall').hidden = false; });
addEventListener('appinstalled', () => { $('#btnInstall').hidden = true; installEvt = null; toast('已安裝到主畫面'); });
// 手機上還沒裝的話一直顯示安裝鈕；Chrome 不給安裝時，按下去顯示檢查結果，方便截圖找原因
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
if (isMobile() && !standalone) $('#btnInstall').hidden = false;
$('#btnInstall').onclick = async () => {
  if (installEvt){ installEvt.prompt(); await installEvt.userChoice; installEvt = null; $('#btnInstall').hidden = true; return; }
  const ua = navigator.userAgent, chrome = (ua.match(/Chrome\/(\d+)/) || [])[1];
  const inApp = /; wv\)|Line\/|FBAN|FBAV|Instagram|Telegram|MicroMessenger/.test(ua);
  let man = '讀取中';
  try { const r = await fetch('manifest.webmanifest', {cache: 'no-store'}); man = r.ok ? `正常（${(await r.json()).name}）` : `讀不到（HTTP ${r.status}）`; } catch(e){ man = '讀不到：' + e.message; }
  const rows = [
    ['網址', location.host === 'reallychien-ops.github.io' ? '正確' : `⚠️ ${location.host}（要用 reallychien-ops.github.io）`],
    ['瀏覽器', inApp ? '⚠️ App 內建瀏覽器（不能安裝）' : /SamsungBrowser/.test(ua) ? 'Samsung 網際網路' : chrome ? `Chrome ${chrome}` : '其他'],
    ['安裝設定檔', man],
    ['背景程式', navigator.serviceWorker?.controller ? '運作中' : '還沒啟動（重新整理一次再試）'],
    ['Chrome 允許安裝', '否（沒有收到安裝通知）'],
  ];
  $('#instBody').innerHTML = `<p style="margin:0 0 8px">Chrome 目前沒有給這個網頁「安裝」。檢查結果：</p>
    ${rows.map(([k, v]) => `<div><b>${k}</b>：${esc(v)}</div>`).join('')}
    <p style="margin:10px 0 0;color:var(--muted)">${inApp ? '請按右上角選單「用 Chrome 開啟」，再按一次這顆按鈕。' : '可以先重新整理、等 10 秒再按一次；還是不行就把這個畫面截圖傳給 Claude。'}</p>
    <p style="margin:6px 0 0;color:var(--muted);font-size:12px;word-break:break-all">${esc(ua)}</p>`;
  $('#instOverlay').classList.add('show');
};
$('#instOverlay').addEventListener('click', e => { if (e.target === e.currentTarget || e.target.closest('[data-close]')) e.currentTarget.classList.remove('show'); });

/* ---------- load ---------- */
async function load(fresh){
  const bust = fresh ? `?t=${Date.now()}` : '';
  const [d, l] = await Promise.all([
    fetch('properties.json' + bust, {cache: fresh ? 'reload' : 'default'}).then(r => r.json()),
    fetch('daily_check_log.json' + bust, {cache: fresh ? 'reload' : 'default'}).then(r => r.json()).catch(() => []),
  ]);
  data = d; logs = l;
  const up = `更新 ${data.updated_at}`;
  $('#updated').textContent = up; $('#updatedM').textContent = up;
  if (logs[0] && logs[0].timestamp !== safeGet('tainan_log_seen')){
    const n = (logs[0].changes || []).filter(c => !c.startsWith('✅')).length;
    document.querySelectorAll('.ib .dot').forEach(dEl => { dEl.hidden = !n; dEl.textContent = n > 99 ? '99+' : n; });
  }
  Object.entries(layerOn).forEach(([id, on]) => on && setLayer(id, true));
  render();
}
load().then(() => { fitAll(); if (isMobile()) setSheet('peek'); });

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
